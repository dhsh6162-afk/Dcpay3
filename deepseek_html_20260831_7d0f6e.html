<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dcpay - Official Payment Portal</title>
    <script src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #87CEEB 0%, #8A2BE2 50%, #5B2A86 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            width: 90%;
            max-width: 500px;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .hidden {
            display: none;
        }

        /* Logo */
        .logo {
            font-size: 40px;
            font-weight: 900;
            color: #0056b3;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .tagline {
            color: #8A2BE2;
            font-size: 14px;
            margin-bottom: 20px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* Auth */
        .auth-section h2 {
            color: #5B2A86;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #87CEEB;
            border-radius: 8px;
            margin-bottom: 10px;
            outline: none;
        }

        input:focus {
            border-color: #5B2A86;
        }

        .auth-btn {
            width: 100%;
            background: linear-gradient(90deg, #8A2BE2, #87CEEB);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 10px;
        }

        .auth-btn:hover {
            opacity: 0.9;
        }

        .switch-auth {
            font-size: 14px;
            color: #666;
            margin-top: 10px;
        }

        .switch-auth a {
            color: #5B2A86;
            font-weight: bold;
            cursor: pointer;
            text-decoration: underline;
        }

        /* Payment Section */
        .payment-section {
            margin-top: 20px;
        }

        /* Plans Table */
        .plans-table {
            background: #1a1a2e;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .plan-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            color: white;
            font-size: 14px;
        }

        .plan-row.active {
            color: #00a8ff;
            font-weight: bold;
        }

        /* QR Code Section */
        .qr-section {
            background: #f4f8fc;
            border: 2px dashed #87CEEB;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }

        #qrcode {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Live Dashboard */
        .dashboard {
            background: #1a1a2e;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .clock {
            color: #00a8ff;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .txn-list {
            margin-bottom: 20px;
            text-align: center;
        }

        .txn-item {
            background: #f4f8fc;
            border: 1px solid #e6f2ff;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .txn-info {
            font-size: 14px;
            color: #333;
        }

        .txn-status {
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
            font-weight: bold;
            color: white;
        }

        .status-success {
            background: #28a745;
        }

        .status-pending {
            background: #ffc107;
            color: #333;
        }

        /* Withdrawal Section */
        .withdraw-section {
            background: #e6f2ff;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
        }

        .withdraw-title {
            font-size: 18px;
            color: #5B2A86;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .withdraw-section input {
            width: 100%;
            padding: 12px;
            border: 2px solid #87CEEB;
            border-radius: 8px;
            margin-bottom: 10px;
            outline: none;
        }

        .withdraw-section button {
            width: 100%;
            background: linear-gradient(90deg, #5B2A86, #87CEEB);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .withdraw-section button:hover {
            opacity: 0.9;
        }

        /* Logout */
        .logout-btn {
            background: #ff4d4d;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">Dcpay</div>
        <div class="tagline">Secure. Fast. Trusted.</div>

        <!-- Login Section -->
        <div id="login-section" class="auth-section">
            <h2>Login</h2>
            <input type="email" id="login-email" placeholder="Enter your Email">
            <input type="password" id="login-password" placeholder="Enter your Password">
            <button class="auth-btn" onclick="login()">Login</button>
            <p class="switch-auth">Don't have an account? <a onclick="showRegister()">Register</a></p>
        </div>

        <!-- Register Section -->
        <div id="register-section" class="auth-section hidden">
            <h2>Register</h2>
            <input type="text" id="reg-name" placeholder="Enter your Name">
            <input type="email" id="reg-email" placeholder="Enter your Email">
            <input type="password" id="reg-password" placeholder="Create a Password">
            <button class="auth-btn" onclick="register()">Register</button>
            <p class="switch-auth">Already have an account? <a onclick="showLogin()">Login</a></p>
        </div>

        <!-- Payment Section -->
        <div id="payment-section" class="payment-section hidden">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3 style="color: #5B2A86;">Welcome!</h3>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>

            <!-- Plans Table -->
            <div class="plans-table">
                <h3 style="color: #00a8ff; margin-bottom: 15px;">Investment Plans</h3>
                <div class="plan-row">
                    <span>Savings</span>
                    <span>5%</span>
                    <span>₹5,000</span>
                </div>
                <div class="plan-row">
                    <span>Current</span>
                    <span>8%</span>
                    <span>₹10,000</span>
                </div>
                <div class="plan-row">
                    <span>Corporate</span>
                    <span>12%</span>
                    <span>₹15,000</span>
                </div>
            </div>

            <!-- QR Code Section -->
            <div class="qr-section">
                <h3 style="color: #5B2A86; margin-bottom: 10px;">Scan to Pay</h3>
                <div id="qrcode"></div>
            </div>

            <!-- Payment Details -->
            <input type="text" id="upi-id" placeholder="Enter UPI ID (e.g., name@upi)">
            <input type="number" id="amount" placeholder="Enter Amount (₹)">
            <input type="text" id="payment-number" placeholder="Payment Number (Auto-generated)" readonly>
            
            <button class="pay-btn" onclick="processPayment()">Proceed to Pay</button>
            <p id="success-msg" class="hidden"></p>
        </div>

        <!-- Live Dashboard -->
        <div id="live-dashboard" class="dashboard hidden">
            <div class="clock" id="live-clock">00:00:00</div>
            <h3 style="color: #00a8ff; margin-bottom: 15px;">Live Transactions</h3>
            <div id="txn-container"></div>
        </div>

        <!-- Withdrawal Section -->
        <div class="withdraw-section hidden" id="withdraw-section">
            <div class="withdraw-title">Withdrawal Request</div>
            <input type="number" id="withdraw-amount" placeholder="Enter Amount to Withdraw">
            <input type="text" id="withdraw-account" placeholder="Enter Bank/UPI Account">
            <button onclick="withdraw()">Request Withdrawal</button>
        </div>
    </div>

    <script>
        // --- 1. Login/Register System ---
        function showRegister() {
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('register-section').classList.remove('hidden');
        }

        function showLogin() {
            document.getElementById('register-section').classList.add('hidden');
            document.getElementById('login-section').classList.remove('hidden');
        }

        function register() {
            const name = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;

            if (!name || !email || !password) {
                alert("Please fill all details.");
                return;
            }

            localStorage.setItem('dcpay_user', JSON.stringify({ name: name, email: email, password: password }));
            alert("Registration Successful! Please Login.");
            showLogin();
        }

        function login() {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            if (!email || !password) {
                alert("Please fill all details.");
                return;
            }

            const savedUser = JSON.parse(localStorage.getItem('dcpay_user'));

            if (savedUser && savedUser.email === email && savedUser.password === password) {
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('payment-section').classList.remove('hidden');
                
                // QR Code Generate karna
                generateQRCode();
            } else {
                alert("Invalid Email or Password! Please register first.");
            }
        }

        function logout() {
            localStorage.removeItem('dcpay_user');
            document.getElementById('payment-section').classList.add('hidden');
            document.getElementById('login-section').classList.remove('hidden');
            document.getElementById('login-email').value = '';
            document.getElementById('login-password').value = '';
        }

        // --- 2. QR Code Generation ---
        function generateQRCode() {
            const qrContainer = document.getElementById('qrcode');
            qrContainer.innerHTML = '';

            const qrCode = new QRCodeStyling({
                width: 250,
                height: 250,
                data: window.location.href,
                image: "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI1MDAiIGhlaWdodD0iNTAwIj48cmVjdCB3aWR0aD0iNTAwIiBoZWlnaHQ9IjUwMCIgZmlsbD0iIzAwNTZiMyIvPjx0ZXh0IHg9IjI1MCIgeT0iMjUwIiBmb250LWZhbWlseT0iQXJpYWwsIHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMTIwIiBmb250LXdlaWdodD0iYm9sZCIgZmlsbD0id2hpdGUiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGRvbWluYW50LWJhc2VsaW5lPSJtaWRkbGUiPkRjcGF5PC90ZXh0Pjwvc3ZnPg==",
                imageOptions: {
                    crossOrigin: "anonymous",
                    margin: 8,
                    imageSize: 0.5,
                    hideBackgroundDots: true
                },
                dotsOptions: {
                    color: "#5B2A86",
                    type: "rounded"
                },
                backgroundOptions: {
                    color: "#ffffff",
                }
            });

            qrCode.append(qrContainer);
        }

        // --- 3. Payment Process (UPI Accept Karne Ke Baad) ---
        function processPayment() {
            const upi = document.getElementById('upi-id').value;
            const amount = document.getElementById('amount').value;

            if (!upi || !amount) {
                alert("Please enter all payment details.");
                return;
            }

            // Amount ke hisaab se Plan select karein
            let plan = "Savings";
            let percentage = 5;
            if (parseFloat(amount) >= 15000) {
                plan = "Corporate";
                percentage = 12;
            } else if (parseFloat(amount) >= 10000) {
                plan = "Current";
                percentage = 8;
            }

            // Payment Number Generate karein
            const paymentNumber = "DCP" + Math.floor(Math.random() * 1000000);
            document.getElementById('payment-number').value = paymentNumber;

            // Commission Calculate karein
            const commission = amount * (percentage / 100);

            // Success message
            const msg = document.getElementById('success-msg');
            msg.classList.remove('hidden');
            msg.innerText = `Payment Successful! Plan: ${plan}, Commission: ₹${commission}`;
            
            // Live Dashboard dikhayein
            showLiveDashboard();
        }

        // --- 4. Live Dashboard (Clock + Transactions) ---
        function showLiveDashboard() {
            document.getElementById('payment-section').classList.add('hidden');
            document.getElementById('live-dashboard').classList.remove('hidden');
            document.getElementById('withdraw-section').classList.remove('hidden');

            updateClock();
            updateTransactions();
        }

        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('live-clock').innerText = `${hours}:${minutes}:${seconds}`;
        }

        setInterval(updateClock, 1000);

        let transactions = [
            { user: "Rahul", amount: 2500, method: "UPI", status: "Success" },
            { user: "Priya", amount: 1200, method: "Card", status: "Pending" },
            { user: "Amit", amount: 4000, method: "NetBanking", status: "Success" },
            { user: "Sneha", amount: 3500, method: "UPI", status: "Success" },
            { user: "Vikas", amount: 1500, method: "Card", status: "Pending" },
            { user: "Neha", amount: 5000, method: "UPI", status: "Success" },
            { user: "Rohan", amount: 800, method: "NetBanking", status: "Pending" },
            { user: "Kavya", amount: 2200, method: "UPI", status: "Success" }
        ];

        function updateTransactions() {
            const randomTx = transactions[Math.floor(Math.random() * transactions.length)];
            const randomAmount = Math.floor(Math.random() * 3000) + 500;
            const newTx = {
                user: randomTx.user,
                amount: randomAmount,
                method: randomTx.method,
                status: Math.random() > 0.2 ? "Success" : "Pending"
            };

            transactions.unshift(newTx);
            if (transactions.length > 5) {
                transactions.pop();
            }

            let txnList = document.getElementById('txn-container');
            txnList.innerHTML = '';

            for (let i = 0; i < transactions.length; i++) {
                let txn = transactions[i];
                let statusClass = txn.status === "Success" ? "status-success" : "status-pending";
                
                txnList.innerHTML += `
                    <div class="txn-item">
                        <div class="txn-info">
                            <strong>User:</strong> ${txn.user}<br>
                            <strong>Amount:</strong> ₹${txn.amount}<br>
                            <strong>Method:</strong> ${txn.method}
                        </div>
                        <div class="txn-status ${statusClass}">${txn.status}</div>
                    </div>
                `;
            }
        }

        setInterval(updateTransactions, 4000);

        // --- 5. Withdrawal Function ---
        function withdraw() {
            const amount = document.getElementById('withdraw-amount').value;
            const account = document.getElementById('withdraw-account').value;

            if (!amount || !account) {
                alert("Please enter amount and account details.");
                return;
            }

            alert(`Withdrawal of ₹${amount} requested successfully to ${account}!`);
            
            document.getElementById('withdraw-amount').value = '';
            document.getElementById('withdraw-account').value = '';
        }
    </script>

</body>
</html>
