<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dcpay - Official Payment Portal</title>
    <!-- QR Code Styling Library -->
    <script src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* Background: Purple aur Sky Blue ka mix (Yahi naya change hai) */
            background: linear-gradient(135deg, #87CEEB 0%, #8A2BE2 50%, #5B2A86 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            width: 90%;
            max-width: 500px;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .hidden {
            display: none;
        }

        /* Logo Section */
        .logo {
            font-size: 40px;
            font-weight: 900;
            color: #0056b3;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .tagline {
            color: #8A2BE2;
            font-size: 14px;
            margin-bottom: 20px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* Auth Section (Login/Register) */
        .auth-section h2 {
            color: #5B2A86;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #87CEEB;
            border-radius: 8px;
            margin-bottom: 10px;
            outline: none;
        }

        input:focus {
            border-color: #5B2A86;
        }

        .auth-btn {
            width: 100%;
            background: linear-gradient(90deg, #8A2BE2, #87CEEB);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 10px;
        }

        .auth-btn:hover {
            opacity: 0.9;
        }

        .switch-auth {
            font-size: 14px;
            color: #666;
            margin-top: 10px;
        }

        .switch-auth a {
            color: #5B2A86;
            font-weight: bold;
            cursor: pointer;
            text-decoration: underline;
        }

        /* Payment Section */
        .payment-section {
            margin-top: 20px;
        }

        /* Transaction Stats Section (Sirf yahan space badhaya hai) */
        .stats-container {
            background: #1a1a2e;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            
            display: flex;
            justify-content: space-between;
            gap: 35px; /* Space barabar hai */
            text-align: center;
        }

        .stat-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-width: 0;
        }

        .stat-value {
            color: #00a8ff;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .stat-label {
            color: #8b949e;
            font-size: 12px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* QR Code Section */
        .qr-section {
            background: #f4f8fc;
            border: 2px dashed #87CEEB;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }

        #qrcode {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Payment Options */
        .payment-options {
            background: #e6f2ff;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .payment-title {
            font-size: 18px;
            color: #5B2A86;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .methods {
            display: flex;
            justify-content: space-around;
            gap: 10px;
        }

        .method-btn {
            background: #5B2A86;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: 0.3s;
            width: 30%;
        }

        .method-btn:hover {
            background: #8A2BE2;
            transform: translateY(-2px);
        }

        .method-btn.active {
            background: #87CEEB;
            color: #5B2A86;
        }

        button.pay-btn {
            width: 100%;
            background: linear-gradient(90deg, #5B2A86, #87CEEB);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        button.pay-btn:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }

        #success-msg {
            color: green;
            margin-top: 10px;
            font-weight: bold;
        }

        .logout-btn {
            background: #ff4d4d;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo -->
        <div class="logo">Dcpay</div>
        <div class="tagline">Secure. Fast. Trusted.</div>

        <!-- Login Section -->
        <div id="login-section" class="auth-section">
            <h2>Login</h2>
            <input type="email" id="login-email" placeholder="Enter your Email">
            <input type="password" id="login-password" placeholder="Enter your Password">
            <button class="auth-btn" onclick="login()">Login</button>
            <p class="switch-auth">Don't have an account? <a onclick="showRegister()">Register</a></p>
        </div>

        <!-- Register Section -->
        <div id="register-section" class="auth-section hidden">
            <h2>Register</h2>
            <input type="text" id="reg-name" placeholder="Enter your Name">
            <input type="email" id="reg-email" placeholder="Enter your Email">
            <input type="password" id="reg-password" placeholder="Create a Password">
            <button class="auth-btn" onclick="register()">Register</button>
            <p class="switch-auth">Already have an account? <a onclick="showLogin()">Login</a></p>
        </div>

        <!-- Payment Section (After Login) -->
        <div id="payment-section" class="payment-section hidden">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3 style="color: #5B2A86;">Welcome!</h3>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>

            <!-- Transaction Stats (Sirf Yehi Section hai jisme gap hai) -->
            <div class="stats-container">
                <div class="stat-item">
                    <div class="stat-value">9</div>
                    <div class="stat-label">Total TX</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value">₹7,570</div>
                    <div class="stat-label">AVG Amount</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value">₹68,130</div>
                    <div class="stat-label">Volume</div>
                </div>
            </div>

            <!-- QR Code Section -->
            <div class="qr-section">
                <h3 style="color: #5B2A86; margin-bottom: 10px;">Scan to Pay</h3>
                <div id="qrcode"></div>
            </div>

            <!-- Payment Methods -->
            <div class="payment-options">
                <div class="payment-title">Select Payment Method</div>
                <div class="methods">
                    <button class="method-btn active" onclick="selectMethod('UPI')">UPI</button>
                    <button class="method-btn" onclick="selectMethod('Card')">Card</button>
                    <button class="method-btn" onclick="selectMethod('NetBanking')">NetBanking</button>
                </div>
            </div>

            <!-- Payment Details Form -->
            <input type="text" id="upi-id" placeholder="Enter UPI ID (e.g., name@upi)">
            <input type="text" id="amount" placeholder="Enter Amount (₹)">
            
            <!-- Pay Button -->
            <button class="pay-btn" onclick="processPayment()">Proceed to Pay</button>

            <p id="success-msg" class="hidden"></p>
        </div>
    </div>

    <script>
        // --- 1. Login/Register System (Working) ---
        function showRegister() {
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('register-section').classList.remove('hidden');
        }

        function showLogin() {
            document.getElementById('register-section').classList.add('hidden');
            document.getElementById('login-section').classList.remove('hidden');
        }

        function register() {
            const name = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;

            if (!name || !email || !password) {
                alert("Please fill all details.");
                return;
            }

            // User data ko localStorage mein save karna
            localStorage.setItem('dcpay_user', JSON.stringify({ name: name, email: email, password: password }));
            alert("Registration Successful! Please Login.");
            showLogin();
        }

        function login() {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            if (!email || !password) {
                alert("Please fill all details.");
                return;
            }

            // Saved user ko check karna
            const savedUser = JSON.parse(localStorage.getItem('dcpay_user'));
            
            if (savedUser && savedUser.email === email && savedUser.password === password) {
                // Login success
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('payment-section').classList.remove('hidden');
                
                // QR Code Generate karna (Login ke baad)
                generateQRCode();
            } else {
                alert("Invalid Email or Password! Please register first.");
            }
        }

        function logout() {
            localStorage.removeItem('dcpay_user');
            document.getElementById('payment-section').classList.add('hidden');
            document.getElementById('login-section').classList.remove('hidden');
            document.getElementById('login-email').value = '';
            document.getElementById('login-password').value = '';
        }

        // --- 2. QR Code Generation with Dcpay Logo ---
        function generateQRCode() {
            const qrContainer = document.getElementById('qrcode');
            qrContainer.innerHTML = ''; 

            const qrCode = new QRCodeStyling({
                width: 250,
                height: 250,
                // Yahan apna live URL daalein
                data: window.location.href, 
                image: "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI1MDAiIGhlaWdodD0iNTAwIj48cmVjdCB3aWR0aD0iNTAwIiBoZWlnaHQ9IjUwMCIgZmlsbD0iIzAwNTZiMyIvPjx0ZXh0IHg9IjI1MCIgeT0iMjUwIiBmb250LWZhbWlseT0iQXJpYWwsIHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMTIwIiBmb250LXdlaWdodD0iYm9sZCIgZmlsbD0id2hpdGUiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGRvbWluYW50LWJhc2VsaW5lPSJtaWRkbGUiPkRjcGF5PC90ZXh0Pjwvc3ZnPg==",
                imageOptions: {
                    crossOrigin: "anonymous",
                    margin: 8,
                    imageSize: 0.5,
                    hideBackgroundDots: true
                },
                dotsOptions: {
                    color: "#5B2A86",
                    type: "rounded"
                },
                backgroundOptions: {
                    color: "#ffffff",
                }
            });

            qrCode.append(qrContainer);
        }

        // --- 3. Payment Method Selection ---
        function selectMethod(method) {
            const buttons = document.querySelectorAll('.method-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            
            event.target.classList.add('active');
            
            const input = document.getElementById('upi-id');
            if (method === 'UPI') {
                input.placeholder = "Enter UPI ID (e.g., name@upi)";
            } else if (method === 'Card') {
                input.placeholder = "Enter Card Number (e.g., 1234 5678 9012)";
            } else {
                input.placeholder = "Enter Bank Account Number";
            }
        }

        // --- 4. Payment Processing (Working) ---
        function processPayment() {
            const upi = document.getElementById('upi-id').value;
            const amount = document.getElementById('amount').value;

            if (!upi || !amount) {
                alert("Please enter all payment details.");
                return;
            }

            const payBtn = document.querySelector('.pay-btn');
            payBtn.innerText = "Processing...";
            payBtn.disabled = true;

            setTimeout(() => {
                payBtn.innerText = "Proceed to Pay";
                payBtn.disabled = false;
                
                const msg = document.getElementById('success-msg');
                msg.classList.remove('hidden');
                msg.innerText = `Payment of ₹${amount} successful via ${document.querySelector('.method-btn.active').innerText}!`;
                
                document.getElementById('upi-id').value = '';
                document.getElementById('amount').value = '';
            }, 2000);
        }
    </script>

</body>
</html>
